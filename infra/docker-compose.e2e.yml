name: gamelens-ai-e2e

x-e2e-live-runtime: &e2e-live-runtime
  ENVIRONMENT: test
  DATABASE_URL: postgresql+psycopg://gamelens_e2e:gamelens_e2e_only@test-db:5432/gamelens_e2e_test
  CORS_ORIGINS: http://gamelens.test:3000
  ANONYMOUS_SESSION_SECRET: stage-4-e2e-only-session-secret-not-production
  ANONYMOUS_SESSION_COOKIE_SECURE: "false"
  CONSENT_VERSION: stage-4-v1
  LOG_LEVEL: WARNING
  MODEL_ARTIFACT_PATH: /tmp/gamelens-e2e/artifact-set/content-v1
  COLLABORATIVE_ARTIFACT_PATH: ""
  COLLABORATIVE_LIVE_DATA_ENABLED: "true"
  COLLABORATIVE_CONTRIBUTION_CONSENT_VERSION: stage-5-contribution-v1
  COLLABORATIVE_LIVE_PROMOTION_ENABLED: "false"
  COLLABORATIVE_ALLOW_TEST_FIXTURE: "false"

x-e2e-live-build: &e2e-live-build
  <<: *e2e-live-runtime
  COLLABORATIVE_LIVE_PROMOTION_ENABLED: "true"

services:
  test-db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: gamelens_e2e_test
      POSTGRES_USER: gamelens_e2e
      POSTGRES_PASSWORD: gamelens_e2e_only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U gamelens_e2e -d gamelens_e2e_test
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s

  e2e-setup:
    image: gamelens-ai-api:e2e
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    read_only: true
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://gamelens_e2e:gamelens_e2e_only@test-db:5432/gamelens_e2e_test
      CORS_ORIGINS: http://gamelens.test:3000
      ANONYMOUS_SESSION_SECRET: stage-4-e2e-only-session-secret-not-production
      LOG_LEVEL: WARNING
    depends_on:
      test-db:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - python -m alembic upgrade head && python -m app.db.seed
    restart: "no"

  e2e-artifact-init:
    image: gamelens-ai-api:e2e
    user: root
    read_only: true
    depends_on:
      e2e-setup:
        condition: service_completed_successfully
    volumes:
      - e2e_artifact_set:/tmp/gamelens-e2e/artifact-set
    command:
      - /bin/sh
      - -ec
      - >-
        test -d /tmp/gamelens-e2e/artifact-set &&
        test -z "$$(find /tmp/gamelens-e2e/artifact-set -mindepth 1 -maxdepth 1 -print -quit)" &&
        chown --no-dereference gamelens:gamelens /tmp/gamelens-e2e/artifact-set &&
        chmod 0750 /tmp/gamelens-e2e/artifact-set
    restart: "no"

  e2e-test-evidence-init:
    profiles:
      - fixture
    image: gamelens-ai-api:e2e
    user: root
    read_only: true
    depends_on:
      e2e-setup:
        condition: service_completed_successfully
    volumes:
      - e2e_test_evidence:/tmp/gamelens-e2e/evidence
    command:
      - /bin/sh
      - -ec
      - >-
        test -d /tmp/gamelens-e2e/evidence &&
        test -z "$$(find /tmp/gamelens-e2e/evidence -mindepth 1 -maxdepth 1 -print -quit)" &&
        chown --no-dereference 1001:1001 /tmp/gamelens-e2e/evidence &&
        chmod 0755 /tmp/gamelens-e2e/evidence
    restart: "no"

  e2e-model:
    image: gamelens-ai-api:e2e
    read_only: true
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://gamelens_e2e:gamelens_e2e_only@test-db:5432/gamelens_e2e_test
      CORS_ORIGINS: http://gamelens.test:3000
      ANONYMOUS_SESSION_SECRET: stage-4-e2e-only-session-secret-not-production
      LOG_LEVEL: WARNING
    depends_on:
      e2e-artifact-init:
        condition: service_completed_successfully
    volumes:
      - e2e_artifact_set:/tmp/gamelens-e2e/artifact-set
    command:
      - /bin/sh
      - -ec
      - >-
        test "$$(id -u)" -ne 0 &&
        python -m app.commands.recommendation_artifact build
        --output /tmp/gamelens-e2e/artifact-set/content-v1
    restart: "no"

  e2e-model-validate:
    image: gamelens-ai-api:e2e
    read_only: true
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://gamelens_e2e:gamelens_e2e_only@test-db:5432/gamelens_e2e_test
      CORS_ORIGINS: http://gamelens.test:3000
      ANONYMOUS_SESSION_SECRET: stage-4-e2e-only-session-secret-not-production
      LOG_LEVEL: WARNING
      MODEL_ARTIFACT_PATH: /tmp/gamelens-e2e/artifact-set/content-v1
      COLLABORATIVE_ARTIFACT_PATH: ""
      COLLABORATIVE_LIVE_DATA_ENABLED: "false"
      COLLABORATIVE_CONTRIBUTION_CONSENT_VERSION: ""
      COLLABORATIVE_LIVE_PROMOTION_ENABLED: "false"
      COLLABORATIVE_ALLOW_TEST_FIXTURE: "false"
    depends_on:
      e2e-model:
        condition: service_completed_successfully
    volumes:
      - e2e_artifact_set:/tmp/gamelens-e2e/artifact-set:ro
    command:
      - python
      - -m
      - app.commands.recommendation_artifact
      - validate
      - --artifact
      - /tmp/gamelens-e2e/artifact-set/content-v1
    restart: "no"

  e2e-collaborative-model:
    profiles:
      - fixture
    image: gamelens-ai-api:e2e
    read_only: true
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://gamelens_e2e:gamelens_e2e_only@test-db:5432/gamelens_e2e_test
      CORS_ORIGINS: http://gamelens.test:3000
      ANONYMOUS_SESSION_SECRET: stage-4-e2e-only-session-secret-not-production
      LOG_LEVEL: WARNING
      MODEL_ARTIFACT_PATH: /tmp/gamelens-e2e/artifact-set/content-v1
      COLLABORATIVE_ARTIFACT_PATH: /tmp/gamelens-e2e/artifact-set/collaborative-fixture-v1
      COLLABORATIVE_FIXTURE_PATH: /workspace/data/fixtures/interactions/collaborative-interactions.json
      COLLABORATIVE_LIVE_DATA_ENABLED: "false"
      COLLABORATIVE_CONTRIBUTION_CONSENT_VERSION: ""
      COLLABORATIVE_LIVE_PROMOTION_ENABLED: "false"
      COLLABORATIVE_ALLOW_TEST_FIXTURE: "true"
    depends_on:
      e2e-model:
        condition: service_completed_successfully
    volumes:
      - e2e_artifact_set:/tmp/gamelens-e2e/artifact-set
    command:
      - /bin/sh
      - -ec
      - >-
        test "$$(id -u)" -ne 0 &&
        python -m app.commands.collaborative_artifact build
        --source fixture
        --output /tmp/gamelens-e2e/artifact-set/collaborative-fixture-v1
        --fixture /workspace/data/fixtures/interactions/collaborative-interactions.json
        --catalog /workspace/data/catalog/games.json
    restart: "no"

  e2e-collaborative-validate:
    profiles:
      - fixture
    image: gamelens-ai-api:e2e
    read_only: true
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://gamelens_e2e:gamelens_e2e_only@test-db:5432/gamelens_e2e_test
      CORS_ORIGINS: http://gamelens.test:3000
      ANONYMOUS_SESSION_SECRET: stage-4-e2e-only-session-secret-not-production
      LOG_LEVEL: WARNING
      MODEL_ARTIFACT_PATH: /tmp/gamelens-e2e/artifact-set/content-v1
      COLLABORATIVE_ARTIFACT_PATH: /tmp/gamelens-e2e/artifact-set/collaborative-fixture-v1
      COLLABORATIVE_FIXTURE_PATH: /workspace/data/fixtures/interactions/collaborative-interactions.json
      COLLABORATIVE_LIVE_DATA_ENABLED: "false"
      COLLABORATIVE_CONTRIBUTION_CONSENT_VERSION: ""
      COLLABORATIVE_LIVE_PROMOTION_ENABLED: "false"
      COLLABORATIVE_ALLOW_TEST_FIXTURE: "true"
    depends_on:
      e2e-collaborative-model:
        condition: service_completed_successfully
    volumes:
      - e2e_artifact_set:/tmp/gamelens-e2e/artifact-set:ro
    command:
      - python
      - -m
      - app.commands.collaborative_artifact
      - validate
      - --artifact
      - /tmp/gamelens-e2e/artifact-set/collaborative-fixture-v1
      - --catalog
      - /workspace/data/catalog/games.json
    restart: "no"

  e2e-live-evidence-init:
    profiles:
      - live-source
    image: gamelens-ai-api:e2e
    user: root
    read_only: true
    depends_on:
      e2e-model-validate:
        condition: service_completed_successfully
    volumes:
      - e2e_live_evidence:/tmp/gamelens-e2e/live-evidence
    command:
      - /bin/sh
      - -ec
      - >-
        test -d /tmp/gamelens-e2e/live-evidence &&
        test -z "$$(find /tmp/gamelens-e2e/live-evidence -mindepth 1 -maxdepth 1 -print -quit)" &&
        chown --no-dereference gamelens:gamelens /tmp/gamelens-e2e/live-evidence &&
        chmod 0750 /tmp/gamelens-e2e/live-evidence
    restart: "no"

  e2e-live-cohort:
    profiles:
      - live-source
    image: gamelens-ai-api:e2e
    read_only: true
    environment:
      <<: *e2e-live-runtime
      GAMELENS_TEST_DATABASE_URL: postgresql+psycopg://gamelens_e2e:gamelens_e2e_only@test-db:5432/gamelens_e2e_test
      GAMELENS_ALLOW_TEST_DATABASE_RESET: "true"
    depends_on:
      e2e-live-evidence-init:
        condition: service_completed_successfully
    volumes:
      - e2e_live_evidence:/tmp/gamelens-e2e/live-evidence
    command:
      - /bin/sh
      - -ec
      - >-
        output="$$(python -m tests.fixtures.collaborative_lifecycle
        create-cohort --scenario stage-5-disposable-lifecycle-v1)" &&
        printf '%s\n' "$$output" &&
        printf '%s\n' "$$output" >
        /tmp/gamelens-e2e/live-evidence/.stage8f-cohort.json
    restart: "no"

  e2e-live-audit:
    profiles:
      - live-source
    image: gamelens-ai-api:e2e
    read_only: true
    environment:
      <<: *e2e-live-runtime
    depends_on:
