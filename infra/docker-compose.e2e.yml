name: gamelens-ai-e2e

services:
  e2e-db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: gamelens_e2e
      POSTGRES_USER: gamelens_e2e
      POSTGRES_PASSWORD: gamelens_e2e_only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U gamelens_e2e -d gamelens_e2e
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s

  e2e-setup:
    image: gamelens-ai-api:e2e
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://gamelens_e2e:gamelens_e2e_only@e2e-db:5432/gamelens_e2e
      CORS_ORIGINS: http://gamelens.test:3000
      ANONYMOUS_SESSION_SECRET: stage-4-e2e-only-session-secret-not-production
      LOG_LEVEL: WARNING
    depends_on:
      e2e-db:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - python -m alembic upgrade head && python -m app.db.seed
    restart: "no"

  e2e-artifact-init:
    image: gamelens-ai-api:e2e
    user: root
    depends_on:
      e2e-setup:
        condition: service_completed_successfully
    volumes:
      - e2e_artifact:/artifacts
    command:
      - /bin/sh
      - -c
      - chown gamelens:gamelens /artifacts
    restart: "no"

  e2e-model:
    image: gamelens-ai-api:e2e
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://gamelens_e2e:gamelens_e2e_only@e2e-db:5432/gamelens_e2e
      CORS_ORIGINS: http://gamelens.test:3000
      ANONYMOUS_SESSION_SECRET: stage-4-e2e-only-session-secret-not-production
      LOG_LEVEL: WARNING
    depends_on:
      e2e-artifact-init:
        condition: service_completed_successfully
    volumes:
      - e2e_artifact:/artifacts
    command:
      - python
      - -m
      - app.commands.recommendation_artifact
      - build
      - --output
      - /artifacts/content-v1
    restart: "no"

  e2e-api:
    image: gamelens-ai-api:e2e
    environment:
      ENVIRONMENT: test
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: postgresql+psycopg://gamelens_e2e:gamelens_e2e_only@e2e-db:5432/gamelens_e2e
      CORS_ORIGINS: http://gamelens.test:3000
      LOG_LEVEL: WARNING
      MODEL_ARTIFACT_PATH: /artifacts/content-v1
      ANONYMOUS_SESSION_SECRET: stage-4-e2e-only-session-secret-not-production
      ANONYMOUS_SESSION_COOKIE_SECURE: "false"
      CONSENT_VERSION: stage-4-v1
    depends_on:
      e2e-model:
        condition: service_completed_successfully
    volumes:
      - e2e_artifact:/artifacts:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      default:
        aliases:
          - gamelens.test
          - api.gamelens.test

  e2e-web:
    image: gamelens-ai-web:e2e
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://gamelens.test:8000
      NEXT_PUBLIC_CONSENT_VERSION: stage-4-v1
    depends_on:
      e2e-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "Promise.all([fetch('http://localhost:3000'), fetch('http://localhost:3000/games'), fetch('http://localhost:3000/recommendations')]).then((responses) => { if (responses.some((response) => !response.ok)) process.exit(1) })"
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 8s
    # Share the API network namespace so both browser-visible ports use the
    # exact same host. This keeps the cookie first-party in WebKit while still
    # exercising a credentialed cross-origin request across ports.
    network_mode: service:e2e-api

  e2e:
    image: gamelens-ai-playwright:stage4
    build:
      context: ../apps/web
      dockerfile: Dockerfile.e2e
    environment:
      WEB_BASE_URL: http://gamelens.test:3000
      PLAYWRIGHT_EXTERNAL_SERVER: "1"
    depends_on:
      e2e-web:
        condition: service_healthy
    ipc: host

volumes:
  e2e_artifact:
