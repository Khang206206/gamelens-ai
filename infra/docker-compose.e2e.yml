      - -ec
      - >-
        output="$$(python -m app.commands.collaborative_artifact
        recover
        --artifact /tmp/gamelens-e2e/artifact-set/collaborative-live-previous-v1
        --build-id stage8f-live-previous-v1
        --confirm-live-recovery stage8f-live-previous-v1)" &&
        printf '%s\n' "$$output" &&
        printf '%s\n' "$$output" >
