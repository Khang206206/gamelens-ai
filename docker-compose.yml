name: gamelens-ai

services:
  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gamelens}
      POSTGRES_USER: ${POSTGRES_USER:-gamelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamelens_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    image: gamelens-ai-api:stage4
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    environment:
      APP_NAME: ${APP_NAME:-GameLens AI API}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gamelens}:${POSTGRES_PASSWORD:-gamelens_dev_only}@db:5432/${POSTGRES_DB:-gamelens}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MODEL_ARTIFACT_PATH: ${MODEL_ARTIFACT_PATH:-}
      COLLABORATIVE_ARTIFACT_PATH: ${COLLABORATIVE_ARTIFACT_PATH:-}
      COLLABORATIVE_FIXTURE_PATH: ${COLLABORATIVE_FIXTURE_PATH:-/workspace/data/fixtures/interactions/collaborative-interactions.json}
      ANONYMOUS_SESSION_SECRET: ${ANONYMOUS_SESSION_SECRET:-development-only-stage-4-session-secret-change-me}
      ANONYMOUS_SESSION_COOKIE_NAME: ${ANONYMOUS_SESSION_COOKIE_NAME:-gamelens_session}
      ANONYMOUS_SESSION_COOKIE_PATH: ${ANONYMOUS_SESSION_COOKIE_PATH:-/api/v1}
      ANONYMOUS_SESSION_COOKIE_SECURE: ${ANONYMOUS_SESSION_COOKIE_SECURE:-false}
      ANONYMOUS_SESSION_COOKIE_SAMESITE: ${ANONYMOUS_SESSION_COOKIE_SAMESITE:-lax}
      ANONYMOUS_SESSION_TTL_SECONDS: ${ANONYMOUS_SESSION_TTL_SECONDS:-15552000}
      CONSENT_VERSION: ${CONSENT_VERSION:-stage-4-v1}
      COLLABORATIVE_LIVE_DATA_ENABLED: ${COLLABORATIVE_LIVE_DATA_ENABLED:-false}
      COLLABORATIVE_CONTRIBUTION_CONSENT_VERSION: ${COLLABORATIVE_CONTRIBUTION_CONSENT_VERSION:-}
      COLLABORATIVE_LIVE_PROMOTION_ENABLED: ${COLLABORATIVE_LIVE_PROMOTION_ENABLED:-false}
      COLLABORATIVE_ALLOW_TEST_FIXTURE: "false"
      CSRF_HEADER_NAME: ${CSRF_HEADER_NAME:-X-CSRF-Token}
      RECOMMENDATION_EVENT_RETENTION_DAYS: ${RECOMMENDATION_EVENT_RETENTION_DAYS:-90}
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-500}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - ./ml/artifacts:/artifacts:ro

  model-builder:
    profiles:
      - model
    image: gamelens-ai-api:stage4
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gamelens}:${POSTGRES_PASSWORD:-gamelens_dev_only}@db:5432/${POSTGRES_DB:-gamelens}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MODEL_ARTIFACT_PATH: ${MODEL_ARTIFACT_PATH:-/artifacts/content-v1}
      COLLABORATIVE_ARTIFACT_PATH: ${COLLABORATIVE_ARTIFACT_PATH:-}
      COLLABORATIVE_FIXTURE_PATH: ${COLLABORATIVE_FIXTURE_PATH:-/workspace/data/fixtures/interactions/collaborative-interactions.json}
      COLLABORATIVE_LIVE_DATA_ENABLED: ${COLLABORATIVE_LIVE_DATA_ENABLED:-false}
      COLLABORATIVE_CONTRIBUTION_CONSENT_VERSION: ${COLLABORATIVE_CONTRIBUTION_CONSENT_VERSION:-}
      COLLABORATIVE_LIVE_PROMOTION_ENABLED: ${COLLABORATIVE_LIVE_PROMOTION_ENABLED:-false}
      COLLABORATIVE_ALLOW_TEST_FIXTURE: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ml/artifacts:/artifacts
    command:
      - python
      - -m
      - app.commands.recommendation_artifact
      - --help

  collaborative-operator:
    profiles:
      - model
    image: gamelens-ai-api:stage4
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gamelens}:${POSTGRES_PASSWORD:-gamelens_dev_only}@db:5432/${POSTGRES_DB:-gamelens}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ANONYMOUS_SESSION_SECRET: ${ANONYMOUS_SESSION_SECRET:-development-only-stage-4-session-secret-change-me}
      ANONYMOUS_SESSION_COOKIE_NAME: ${ANONYMOUS_SESSION_COOKIE_NAME:-gamelens_session}
      ANONYMOUS_SESSION_COOKIE_PATH: ${ANONYMOUS_SESSION_COOKIE_PATH:-/api/v1}
      ANONYMOUS_SESSION_COOKIE_SECURE: ${ANONYMOUS_SESSION_COOKIE_SECURE:-false}
      ANONYMOUS_SESSION_COOKIE_SAMESITE: ${ANONYMOUS_SESSION_COOKIE_SAMESITE:-lax}
      ANONYMOUS_SESSION_TTL_SECONDS: ${ANONYMOUS_SESSION_TTL_SECONDS:-15552000}
      CONSENT_VERSION: ${CONSENT_VERSION:-stage-4-v1}
      MODEL_ARTIFACT_PATH: ${MODEL_ARTIFACT_PATH:-/artifacts/content-v1}
      COLLABORATIVE_ARTIFACT_PATH: ${COLLABORATIVE_ARTIFACT_PATH:-}
      COLLABORATIVE_FIXTURE_PATH: ${COLLABORATIVE_FIXTURE_PATH:-/workspace/data/fixtures/interactions/collaborative-interactions.json}
      COLLABORATIVE_LIVE_DATA_ENABLED: ${COLLABORATIVE_LIVE_DATA_ENABLED:-false}
      COLLABORATIVE_CONTRIBUTION_CONSENT_VERSION: ${COLLABORATIVE_CONTRIBUTION_CONSENT_VERSION:-}
      COLLABORATIVE_LIVE_PROMOTION_ENABLED: ${COLLABORATIVE_LIVE_PROMOTION_ENABLED:-false}
      COLLABORATIVE_ALLOW_TEST_FIXTURE: "false"
      CSRF_HEADER_NAME: ${CSRF_HEADER_NAME:-X-CSRF-Token}
      RECOMMENDATION_EVENT_RETENTION_DAYS: ${RECOMMENDATION_EVENT_RETENTION_DAYS:-90}
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-500}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ml/artifacts:/artifacts
    command:
      - python
      - -m
      - app.commands.collaborative_artifact
      - --help

  web:
    image: gamelens-ai-web:stage4
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_CONSENT_VERSION: ${NEXT_PUBLIC_CONSENT_VERSION:-stage-4-v1}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./apps/web:/workspace
      - web_node_modules:/workspace/node_modules
      - web_next:/workspace/.next
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then((response) => { if (!response.ok) process.exit(1) })"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 8s

  quality:
    profiles:
      - quality
    image: gamelens-ai-api:stage4
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://gamelens_test:gamelens_test_only@localhost:5432/gamelens_test
      CORS_ORIGINS: http://testserver
      ANONYMOUS_SESSION_SECRET: stage-4-fast-tests-only-session-secret
      LOG_LEVEL: WARNING
      RUFF_CACHE_DIR: /tmp/ruff-cache
      COLLABORATIVE_LIVE_DATA_ENABLED: "false"
      COLLABORATIVE_CONTRIBUTION_CONSENT_VERSION: ""
      COLLABORATIVE_LIVE_PROMOTION_ENABLED: "false"
      COLLABORATIVE_ALLOW_TEST_FIXTURE: "false"
      COLLABORATIVE_ARTIFACT_PATH: /workspace/ml/artifacts/collaborative-fixture-v1
      COLLABORATIVE_FIXTURE_PATH: /workspace/data/fixtures/interactions/collaborative-interactions.json
      PYTHONPATH: /workspace/ml/src
    volumes:
      - ./apps/api:/workspace/apps/api
      - ./data/catalog:/workspace/data/catalog:ro
      - ./data/external/ucsd-steam/manifest.json:/workspace/data/external/ucsd-steam/manifest.json:ro
      - ./data/fixtures:/workspace/data/fixtures:ro
      - ./data/external/ucsd-steam/suitability-audit.json:/workspace/data/external/ucsd-steam/suitability-audit.json:ro
      - ./ml:/workspace/ml

  ucsd-source-audit:
    profiles:
      - source-audit
    image: gamelens-ai-api:stage4
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    network_mode: none
    read_only: true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /workspace/ml/src
    volumes:
      - ./data:/workspace/data:ro
      - ./ml:/workspace/ml:ro
    tmpfs:
      - /tmp

volumes:
  postgres_data:
  web_node_modules:
  web_next:
